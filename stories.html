<script>
    function openStory(storyName) {
        let displayDiv = document.getElementById('story-display');
        
        if(storyName === 'ali') {
            displayDiv.innerHTML = `
                <h3 style="color: #d81b60; margin: 0 0 10px 0;">Nek Dil Ali aur Ramzan</h3>
                <p>Ramzan ka mubarak mahina shuru ho chuka tha. Nanhe Ali ne is saal apna pehla roza rakha tha. Woh subah se bahut khush tha aur shaam ka besabri se intezar kar raha tha.</p>
                <p>Ali ne khidki se bahar dekha. Pados mein rehne wali budhi <b>Zohra Bi</b> apni dehleez par khamosh baithi thi. Unka chehra bahut thaka hua aur udaas lag raha tha.</p>
                <p>Ali dabe paon Zohra Bi ke ghar gaya. Usne dekha ki kitchen ka choolha thanda tha aur dastar-khwan par sirf ek katori pani rakha tha. Uska dil bhar aaya.</p>
                <p>Ali ne apni Ammi se kaha, "Ammi, Zohra Bi ke paas iftari ke liye kuch nahi hai." Safia ne muskura kar kaha, "Beta, Ramzan ka asal maqsad hi dusron ka dard baantna hai."</p>
                <p>Ali ne badi khushi se khajur, phal aur doodh ek tokri mein rakha aur Zohra Bi ke ghar pahunchaya. Us din Ali ne mehsos kiya ki apna pet bharne se kahin zyada sukoon dusron ki bhook mitane mein milta hai.</p>
                <button onclick="closeStory()" style="background: #999; color: white; border: none; padding: 5px 15px; border-radius: 15px; font-size: 11px; margin-top: 10px; cursor: pointer;">Band Karein</button>
            `;
        } else if(storyName === 'chiragh') {
            displayDiv.innerHTML = `
                <h3 style="color: #d81b60; margin: 0 0 10px 0;">Khushiyon ka Chiragh</h3>
                <p>Ek chota sa ladka tha jiska naam Idris tha. Idris bahut hi mehnati aur samajhdaar tha. Uska sapna tha ki woh apne gaon ke har ghar mein khushiyon ka chiragh jalaye.</p>
                <p>Idris ne dekha ki gaon ke log andhere se pareshan hain. Usne himmat nahi haari aur apni thodi si jamapoonji se mitti ka chiragh aur tel khareeda. Woh roz shaam ko gaon ki galiyon mein nikal jata aur jahan andhera hota, wahan ek chiragh jala deta.</p>
                <p>Dheere dheere gaon ke log Idris ki is nek niyati se prabhavit hue. Unhone bhi Idris ka saath dena shuru kiya. Idris ne sikhaya ki agar hum sab mil kar thodi si mehnat karein, toh andhera hamesha ke liye khatam ho sakta hai.</p>
                <p>Aaj Idris ka gaon roshni se jagmaga raha hai, aur log use 'Khushiyon ka Chiragh' dene wala farishta maante hain.</p>
                <button onclick="closeStory()" style="background: #999; color: white; border: none; padding: 5px 15px; border-radius: 15px; font-size: 11px; margin-top: 10px; cursor: pointer;">Band Karein</button>
            `;
        } else if(storyName === 'eid') {
            displayDiv.innerHTML = `
                <h3 style="color: #d81b60; margin: 0 0 10px 0;">Eid ki Meethi Khushiyan</h3>
                <p>Eid ka chaand nikalte hi poore mohalle mein khushiyon ki lahar daud gayi. Har taraf bachhe naye kapde pehan kar ek dusre ko gale laga rahe the.</p>
                <p>Isi mohalle mein Zaid naam ka ek chhota bachha rehta tha, jiske naye kapde nahi ban paaye the kyunki uske abba ki tabiyat kharab thi. Zaid udaas hokar ghar ke kone mein baith gaya.</p>
                <p>Zaid ka dost Kabir jab uske ghar aaya aur usne Zaid ki udaasi dekhi, toh usne turant apne ghar jaakar apni pichli Eid ki ek nayi kurta-pyjama jodi aur meethi sevaiyon ka dibba laakar Zaid ko de diya.</p>
                <p>Kabir ne kaha, "Dost, Eid sirf apne naye kapde pehanne ka naam nahi, balki apno ke chehre par muskaan laane ka naam hai." Zaid ki aankh mein khushiyon ke aansu aa gaye aur usne Kabir ko gale se laga liya.</p>
                <button onclick="closeStory()" style="background: #999; color: white; border: none; padding: 5px 15px; border-radius: 15px; font-size: 11px; margin-top: 10px; cursor: pointer;">Band Karein</button>
            `;
        }
        displayDiv.scrollIntoView({behavior: "smooth"});
    }

    function closeStory() {
        document.getElementById('story-display').innerHTML = '<p style="color: #999; text-align: center; font-size: 12px;">Kahani chunne ke liye click karein...</p>';
    }
</script>
