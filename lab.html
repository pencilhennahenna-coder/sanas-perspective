  <style>
    body {
      background-color: #f4f9f9;

      text-align: center;

    }
    h1 {
      color: #2c3e50;
    }
    .btn-item {
      display: block;
      margin: 15px auto;
      width: 250px;
      background-color: #ff7675;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 16px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      transition: 0.2s;
    }
    .btn-item:hover {
      background-color: #d63031;
      transform: scale(1.05);
    }
    .back-btn {
      display: inline-block;
      margin-top: 30px;
      color: #2c3e50;
      text-decoration: none;
      font-weight: bold;
