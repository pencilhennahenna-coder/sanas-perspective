<style>
body{background:#ccfff8; font-family:sans-serif; padding:10px}
.main{max-width:360px; margin:auto}
input,textarea{width:100%; padding:10px; margin:5px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box}
.d{background:#fff; border-radius:10px; margin:8px 0; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,.1)}
.t{padding:12px; display:flex; justify-content:space-between; cursor:pointer; font-weight:bold}
.a{display:none; padding:10px; border-top:1px solid #eee}
.a pre{background:#111; color:#0f0; padding:8px; font-size:11px; white-space:pre-wrap; margin:0}
.o .a{display:block}
</style>
</head>
<body>
<div class="main">
<h3 style="text-align:center; color:#d81b60">MERA CODE BANK</h3>
<input id="n" placeholder="1. Yahan naam likho - jaise Footer Code">
<textarea id="c" placeholder="2. Yahan apna code likho / paste karo" style="height:80px"></textarea>
<button onclick="add()" style="width:100%; background:#000; color:#fff; padding:11px; border-radius:8px; border:none; font-weight:bold">Add Karo - Patti Banao</button>
<div id="l" style="margin-top:10px"></div>
</div>
<script>
function add(){
let name = document.getElementById('n').value;
let code = document.getElementById('c').value;
if(name.trim()==""){ name = "Mera Code " + (document.querySelectorAll('.d').length + 1); }
if(code.trim()==""){ alert("Code to likho!"); return; }
let d=document.createElement('div'); d.className='d'; d.onclick=function(){this.classList.toggle('o')};
d.innerHTML='<div class=t><span>'+name+'</span><span>▼</span></div><div class=a><pre>'+code.replace(/</g,'&lt;')+'</pre><div style="display:flex; gap:5px; margin-top:6px"><button onclick="copyT(this, event)" style="flex:1; background:#000; color:#fff; padding:8px; border-radius:6px; border:none">Copy</button><button onclick="delT(this, event)" style="flex:1; background:red; color:#fff; padding:8px; border-radius:6px; border:none">Delete</button></div></div>';
document.getElementById('l').prepend(d);
document.getElementById('n').value=''; document.getElementById('c').value='';
}
function copyT(b,e){
e.stopPropagation();
let txt = b.parentElement.parentElement.querySelector('pre').innerText;
let ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
alert("✅ Copy ho gaya!");
}
function delT(b,e){ e.stopPropagation(); if(confirm("Delete kar du?")) b.closest('.d').remove(); }

</script>

</body>
